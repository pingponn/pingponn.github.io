<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夜市乒乓球｜Jack乒乓球</title>

<style>
body{
    margin:0;
    font-family:"Microsoft JhengHei",sans-serif;
    background:linear-gradient(135deg,#5c0000,#990000);
    color:white;
    overflow-x:hidden;
}

/* 背景煙火動畫 */
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background-image:
        radial-gradient(circle, rgba(255,215,0,0.6) 2px, transparent 3px),
        radial-gradient(circle, rgba(255,0,0,0.5) 2px, transparent 3px);
    background-size:150px 150px;
    animation:firework 6s linear infinite;
    z-index:-1;
}
@keyframes firework{
    from{background-position:0 0, 75px 75px;}
    to{background-position:150px 150px, 225px 225px;}
}

/* 金色流光 */
.gold-text{
    background:linear-gradient(90deg,#ffd700,#fff8dc,#ffd700);
    background-size:200% auto;
    color:transparent;
    background-clip:text;
    -webkit-background-clip:text;
    animation:shine 3s linear infinite;
}
@keyframes shine{
    to{background-position:200% center;}
}

/* Header */
header{
    text-align:center;
    padding:30px;
    background:linear-gradient(to right,#8b0000,#ff0000);
    box-shadow:0 0 30px gold;
}
header h1{
    margin:0;
    font-size:36px;
    letter-spacing:4px;
}

/* 輪播 */
.slider{
    position:relative;
    overflow:hidden;
}
.slides{
    display:flex;
    transition:transform 0.6s ease-in-out;
}
.slide{
    min-width:100%;
}
.slide img{
    width:100%;
    height:480px;
    object-fit:cover;
}

/* 圓點 */
.dots{
    position:absolute;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
}
.dot{
    height:12px;
    width:12px;
    margin:0 5px;
    background:#fff;
    border-radius:50%;
    display:inline-block;
    cursor:pointer;
    opacity:0.5;
}
.dot.active{
    opacity:1;
    background:gold;
}

/* 區塊 */
.section{
    padding:80px 20px;
    text-align:center;
    opacity:0;
    transform:translateY(50px);
    transition:1s;
}
.section.show{
    opacity:1;
    transform:translateY(0);
}
.section h2{
    font-size:30px;
    margin-bottom:40px;
}

/* 商品卡片 */
.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:40px;
}
.card{
    background:white;
    color:black;
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 30px gold;
    transition:0.4s;
}
.card:hover{
    transform:scale(1.08);
}
.card img{
    width:100%;
    height:auto;
    object-fit:contain;
    border-radius:15px;
}

/* 規則 */
.rules{
    background:#111;
    border-top:5px solid gold;
    border-bottom:5px solid gold;
}

/* 評價 */
.review-box{
    max-width:900px;
    margin:auto;
    background:white;
    color:black;
    padding:35px;
    border-radius:20px;
    box-shadow:0 0 30px gold;
}

/* Footer */
footer{
    text-align:center;
    padding:30px;
    background:black;
}
footer a{
    color:yellow;
    font-weight:bold;
    text-decoration:none;
}
</style>
</head>

<body>

<header>
    <h1 class="gold-text">🎯 夜市乒乓球 🎯</h1>
    <p class="gold-text">🧨 迎春納福 · 金蛇狂舞 🧨</p>
</header>

<!-- 自動輪播 -->
<div class="slider">
    <div class="slides" id="slides">
        <div class="slide">
            <img src="https://pingponn.github.io/IMG_1687.jpeg">
        </div>
        <div class="slide">
            <img src="https://pingponn.github.io/IMG_1688.jpeg">
        </div>
    </div>
    <div class="dots">
        <span class="dot active" onclick="currentSlide(0)"></span>
        <span class="dot" onclick="currentSlide(1)"></span>
    </div>
</div>

<!-- 酒瓶 -->
<section class="section">
    <h2 class="gold-text">🍷 精選酒瓶專區 🍷</h2>
    <div class="products">
        <div class="card">
            <img src="https://pingponn.github.io/IMG_1684.jpeg">
            <h3>高級酒品 A</h3>
        </div>
        <div class="card">
            <img src="https://pingponn.github.io/IMG_1685.jpeg">
            <h3>高級酒品 B</h3>
        </div>
    </div>
</section>

<!-- 手鍊 -->
<section class="section">
    <h2 class="gold-text">💎 純金 · 純銀 手鍊 💎</h2>
    <div class="products">
        <div class="card">
            <img src="https://pingponn.github.io/IMG_1694.jpeg">
            <h3>純金手鍊</h3>
        </div>
        <div class="card">
            <img src="https://pingponn.github.io/IMG_1694.jpeg">
            <h3>純銀手鍊</h3>
        </div>
    </div>
</section>

<!-- 遊戲規則 -->
<section class="section rules">
    <h2 class="gold-text">📜 遊戲規則 📜</h2>
    <p>僅能用丟的方式投擲，不得拋或彈進，需直接落入杯中才算成功。</p>
</section>

<!-- 顧客評價 -->
<section class="section">
    <h2 class="gold-text">🌟 顧客真實評價 🌟</h2>
    <div class="review-box">
        <img src="https://pingponn.github.io/IMG_1692.jpeg" style="width:100%; border-radius:15px;">
        <h3>★★★★★ 5.0 滿分推薦</h3>
        <p>現場氣氛超熱鬧，獎品真的豪華又專業，新年來玩超有感！</p>
    </div>
</section>

<footer>
    Copyright © 2026 Jack乒乓球 All Rights Reserved.<br>
    Powered by <a href="https://jack0852.github.io" target="_blank">Jack</a> · 迎春納福 · 🧨 金蛇狂舞 🧨 <br>
    © 2026 本網站由 Jack 維護
</footer>

<script>
let index=0;
const slides=document.getElementById("slides");
const dots=document.querySelectorAll(".dot");

function showSlide(i){
    index=i;
    slides.style.transform="translateX(" + (-i*100) + "%)";
    dots.forEach(dot=>dot.classList.remove("active"));
    dots[i].classList.add("active");
}

function currentSlide(i){
    showSlide(i);
}

setInterval(()=>{
    index=(index+1)%2;
    showSlide(index);
},4000);

/* 滾動動畫 */
const sections=document.querySelectorAll(".section");
window.addEventListener("scroll",()=>{
    sections.forEach(sec=>{
        const top=sec.getBoundingClientRect().top;
        if(top<window.innerHeight-100){
            sec.classList.add("show");
        }
    });
});
</script>

</body>
</html>
